[package]
name = "vox-connections"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "macros"] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "query", "stream"] }
futures-util = "0.3"
url = "2"
hmac = "0.12"
base64 = "0.23.1"
tokio = { version = "1.53.1", features = ["net", "time", "sync", "rt", "macros"] }
ring = "0.17.14"
tracing = "0.1"
yaml_serde = "0.10.7"
jsonschema = { version = "0.57", default-features = false }
