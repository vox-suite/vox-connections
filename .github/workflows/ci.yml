name: Connector checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  connectors:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_independent
      CONNECTIONS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vox_connectors
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Standalone schema and integration flow
        run: |
          createdb -h 127.0.0.1 -U postgres vox_connectors
          cargo test --locked --lib accounts::tests -- --ignored
      - name: Independent host platform, schemas and reviewed setup
        run: |
          createdb -h 127.0.0.1 -U postgres vox_independent
          for schema_file in examples/independent_host_schema.sql schema/connectors.sql schema/public-mcp.sql schema/skill-content.sql schema/discovery.sql schema/playstation.sql schema/packages.sql schema/setup.sql schema/accounts.sql schema/account-authority.sql; do
            psql -h 127.0.0.1 -U postgres -d vox_independent -v ON_ERROR_STOP=1 -f "$schema_file"
          done
          cargo test --locked --test postgres_integration --test setup_integration --test google_read_integration --test provider_recovery -- --ignored
      - name: Bounded metadata loading and drift
        run: |
          createdb -h 127.0.0.1 -U postgres vox_metadata
          for schema_file in examples/independent_host_schema.sql schema/connectors.sql schema/public-mcp.sql schema/skill-content.sql schema/discovery.sql schema/packages.sql schema/setup.sql; do
            psql -h 127.0.0.1 -U postgres -d vox_metadata -v ON_ERROR_STOP=1 -f "$schema_file"
          done
          TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/vox_metadata cargo test --locked --test metadata_load -- --ignored
